name: Deploy VATGuard Docs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - "claude/**"        # also deploy from feature branches for previews
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:       # allow manual trigger from GitHub UI

# Allow one concurrent deployment; cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: true

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ── 1. Lint / validate the OpenAPI spec ──────────────────────────────────
  validate:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli@latest

      - name: Validate OpenAPI spec
        run: redocly lint docs/openapi.json --skip-rule=info-license-url
        continue-on-error: true   # non-blocking for now

  # ── 2. Build static site ──────────────────────────────────────────────────
  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Inline the ReDoc bundle so the API docs page works fully offline
      - name: Download ReDoc standalone bundle
        run: |
          mkdir -p docs/assets
          curl -sSL \
            "https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js" \
            -o docs/assets/redoc.standalone.js
          echo "ReDoc bundle downloaded: $(wc -c < docs/assets/redoc.standalone.js) bytes"

      # Patch api.html to use local bundle (CDN fallback stays as-is for offline browsers)
      - name: Patch api.html to use local ReDoc bundle
        run: |
          sed -i 's|https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js|assets/redoc.standalone.js|g' docs/api.html

      # Optional: run Python tests to verify fraud detection logic still passes
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --quiet \
            fastapi==0.111.0 \
            pydantic==2.7.1 \
            pydantic-settings==2.2.1 \
            scikit-learn==1.4.2 \
            numpy==1.26.4 \
            scipy==1.13.0 \
            networkx==3.3 \
            pytest==8.2.0 \
            pytest-asyncio==0.23.6 \
            httpx==0.27.0

      - name: Run fraud-detection unit tests
        run: |
          pytest tests/test_fraud_detection/ tests/test_api/ -v --tb=short --no-header \
            --ignore=tests/test_fraud_detection/test_risk_scorer.py
        env:
          APP_SECRET_KEY: ci-test-key
          DATABASE_URL: "postgresql+asyncpg://x:x@localhost/x"
          REDIS_URL: "redis://localhost:6379/0"
        continue-on-error: true   # docs deploy shouldn't be blocked by test infra issues

      # Upload the docs/ folder as the Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  # ── 3. Deploy ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
